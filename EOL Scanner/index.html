<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>End of Line Scanner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 500;
      color: #888;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 48px;
      width: 100%;
      max-width: 520px;
    }

    .stat-card {
      flex: 1;
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 12px;
      padding: 20px 24px;
    }

    .stat-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: #555;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.03em;
      word-break: break-all;
    }

    #todayCount { color: #4ade80; }

    .scan-row {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 520px;
    }

    input[type="text"] {
      flex: 1;
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 10px;
      color: #fff;
      font-size: 1.1rem;
      padding: 14px 18px;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus   { border-color: #4ade80; }
    input[type="text"]:disabled { opacity: 0.4; }

    button {
      background: #4ade80;
      border: none;
      border-radius: 10px;
      color: #0f1117;
      font-size: 1rem;
      font-weight: 700;
      padding: 14px 22px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    button:hover    { background: #22c55e; }
    button:active   { transform: scale(0.97); }
    button:disabled { opacity: 0.4; cursor: default; }

    #status {
      margin-top: 18px;
      font-size: 0.9rem;
      font-weight: 500;
      height: 1.2em;
      color: #4ade80;
    }
    #status.error { color: #f87171; }

    @keyframes flash {
      0%   { background: #1f3328; }
      100% { background: #1a1d27; }
    }
    .flash { animation: flash 0.4s ease-out; }
  </style>
</head>
<body>

  <h1>End of Line — Bike Scanner</h1>

  <div class="stats">
    <div class="stat-card" id="lastVinCard">
      <div class="stat-label">Last VIN Scanned</div>
      <div class="stat-value" id="lastVin">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Today's Bikes</div>
      <div class="stat-value" id="todayCount">0</div>
    </div>
  </div>

  <div class="scan-row">
    <input type="text" id="vinInput" placeholder="Scan or type VIN…" autocomplete="off" autofocus />
    <button id="logBtn" onclick="submitVin()">LOG</button>
  </div>

  <div id="status"></div>

  <script>
    // ── !! PASTE YOUR APPS SCRIPT WEB APP URL HERE !! ────────────────────────────
    const API_URL = 'https://script.google.com/macros/s/AKfycbzLsoATjsp2QaAmrg35I7Ve43zP9NTKg5423E87ZE0qVVmoQGLXl6AUqvEmhfLxCJfJ/exec';
    // ─────────────────────────────────────────────────────────────────────────────

    const vinInput    = document.getElementById('vinInput');
    const logBtn      = document.getElementById('logBtn');
    const statusEl    = document.getElementById('status');
    const lastVinEl   = document.getElementById('lastVin');
    const countEl     = document.getElementById('todayCount');
    const lastVinCard = document.getElementById('lastVinCard');

    // Scanner sends Enter after every barcode — auto-submit
    vinInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') submitVin();
    });

    async function submitVin() {
      const vin = vinInput.value.trim();
      if (!vin) return;

      setLoading(true);
      setStatus('Logging…', false);

      try {
        const res  = await fetch(`${API_URL}?action=logScan&vin=${encodeURIComponent(vin)}`);
        const data = await res.json();
        onSuccess(data);
      } catch (err) {
        setStatus('Error: ' + err.message, true);
        setLoading(false);
      }
    }

    function onSuccess(stats) {
      lastVinEl.textContent = stats.lastVin   || '—';
      countEl.textContent   = stats.todayCount || 0;
      vinInput.value        = '';
      setStatus('✓ Logged', false);
      setLoading(false);

      lastVinCard.classList.remove('flash');
      void lastVinCard.offsetWidth;
      lastVinCard.classList.add('flash');

      setTimeout(() => setStatus('', false), 2500);
    }

    function setLoading(on) {
      vinInput.disabled = on;
      logBtn.disabled   = on;
      if (!on) vinInput.focus();
    }

    function setStatus(msg, isError) {
      statusEl.textContent = msg;
      statusEl.className   = isError ? 'error' : '';
    }

    // Load stats on open
    fetch(`${API_URL}?action=getStats`)
      .then(r => r.json())
      .then(onSuccess)
      .catch(() => {});
  </script>

</body>
</html>
