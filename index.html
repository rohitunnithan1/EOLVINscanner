<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EOL Scanner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #f0f0f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Top bar ─────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px;
      border-bottom: 1px solid #1e2130;
    }

    .title {
      font-size: 0.75rem;
      font-weight: 600;
      color: #555;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .count-badge {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .count-num {
      font-size: 2rem;
      font-weight: 800;
      color: #4ade80;
      line-height: 1;
    }

    .count-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: #555;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .download-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 8px;
      color: #aaa;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 8px 14px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .download-btn:hover { border-color: #4ade80; color: #4ade80; }
    .download-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

    /* ── Main area ───────────────────────────────── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 28px;
      gap: 28px;
    }

    /* ── Last VIN card ───────────────────────────── */
    .vin-card {
      width: 100%;
      max-width: 620px;
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 14px;
      padding: 24px 28px;
      transition: background 0.4s;
    }

    .vin-label {
      font-size: 0.65rem;
      font-weight: 700;
      color: #555;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .vin-value {
      font-size: 2.4rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.06em;
      word-break: break-all;
      line-height: 1.15;
      min-height: 2.8rem;
    }

    @keyframes flash {
      0%   { background: #1a2e22; border-color: #4ade80; }
      100% { background: #1a1d27; border-color: #2a2d3a; }
    }
    .flash { animation: flash 0.5s ease-out; }

    /* ── Scan input row ──────────────────────────── */
    .scan-row {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 620px;
    }

    input[type="text"] {
      flex: 1;
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 10px;
      color: #fff;
      font-size: 1.1rem;
      padding: 15px 18px;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus   { border-color: #4ade80; }
    input[type="text"]:disabled { opacity: 0.4; }

    button#logBtn {
      background: #4ade80;
      border: none;
      border-radius: 10px;
      color: #0f1117;
      font-size: 0.9rem;
      font-weight: 800;
      padding: 15px 24px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: background 0.15s, transform 0.1s;
    }
    button#logBtn:hover    { background: #22c55e; }
    button#logBtn:active   { transform: scale(0.97); }
    button#logBtn:disabled { opacity: 0.4; cursor: default; }

    /* ── Status ──────────────────────────────────── */
    #status {
      font-size: 0.85rem;
      font-weight: 600;
      height: 1.1em;
      color: #4ade80;
      letter-spacing: 0.04em;
    }
    #status.error { color: #f87171; }
  </style>
</head>
<body>

  <!-- Top bar -->
  <header>
    <span class="title">End of Line — Bike Scanner</span>
    <div class="top-right">
      <div class="count-badge">
        <span class="count-num" id="todayCount">0</span>
        <span class="count-label">bikes today</span>
      </div>
      <button class="download-btn" onclick="downloadCSV()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M8 2v8M5 7l3 3 3-3M3 12h10" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Export
      </button>
    </div>
  </header>

  <!-- Main -->
  <main>
    <!-- Last VIN -->
    <div class="vin-card" id="vinCard">
      <div class="vin-label">Last VIN Scanned</div>
      <div class="vin-value" id="lastVin">—</div>
    </div>

    <!-- Input -->
    <div class="scan-row">
      <input type="text" id="vinInput" placeholder="Scan or type VIN…" autocomplete="off" autofocus />
      <button id="logBtn" onclick="submitVin()">LOG</button>
    </div>

    <div id="status"></div>
  </main>

  <script>
    // ── CONFIG ──────────────────────────────────────────────────────────────────
    const API_URL = 'https://script.google.com/macros/s/AKfycbzLsoATjsp2QaAmrg35I7Ve43zP9NTKg5423E87ZE0qVVmoQGLXl6AUqvEmhfLxCJfJ/exec';

    // ── ELEMENTS ────────────────────────────────────────────────────────────────
    const vinInput  = document.getElementById('vinInput');
    const logBtn    = document.getElementById('logBtn');
    const statusEl  = document.getElementById('status');
    const lastVinEl = document.getElementById('lastVin');
    const countEl   = document.getElementById('todayCount');
    const vinCard   = document.getElementById('vinCard');

    // ── SUBMIT ──────────────────────────────────────────────────────────────────
    vinInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') submitVin();
    });

    async function submitVin() {
      const vin = vinInput.value.trim();
      if (!vin) return;

      // ── Optimistic update (instant, no waiting) ──
      const prevVin   = lastVinEl.textContent;
      const prevCount = parseInt(countEl.textContent) || 0;
      lastVinEl.textContent = vin.toUpperCase();
      countEl.textContent   = prevCount + 1;
      vinInput.value = '';
      flashCard();
      setStatus('Syncing…', false);

      // ── Confirm with server in background ──
      try {
        const res  = await fetch(`${API_URL}?action=logScan&vin=${encodeURIComponent(vin)}`);
        const data = await res.json();
        // Reconcile with server truth (in case of duplicates or clock drift)
        lastVinEl.textContent = data.lastVin   || vin.toUpperCase();
        countEl.textContent   = data.todayCount ?? (prevCount + 1);
        setStatus('✓ Logged', false);
      } catch (err) {
        // Server failed — roll back optimistic update
        lastVinEl.textContent = prevVin;
        countEl.textContent   = prevCount;
        setStatus('Error — not saved', true);
      }

      setTimeout(() => setStatus('', false), 2500);
    }

    function flashCard() {
      vinCard.classList.remove('flash');
      void vinCard.offsetWidth;
      vinCard.classList.add('flash');
    }

    function setStatus(msg, isError) {
      statusEl.textContent = msg;
      statusEl.className   = isError ? 'error' : '';
    }

    // ── AUTO-REFOCUS when window regains focus ──────────────────────────────────
    window.addEventListener('focus', () => vinInput.focus());
    document.addEventListener('keydown', e => {
      if (document.activeElement !== vinInput && e.key.length === 1) {
        vinInput.focus();
      }
    });

    // ── CSV DOWNLOAD ────────────────────────────────────────────────────────────
    async function downloadCSV() {
      setStatus('Preparing export…', false);
      try {
        const res  = await fetch(`${API_URL}?action=getTodayScans`);
        const data = await res.json();

        if (!data.scans || data.scans.length === 0) {
          setStatus('No scans today yet', true);
          setTimeout(() => setStatus('', false), 2500);
          return;
        }

        const csv  = 'VIN,Timestamp\n' + data.scans.map(s => `${s.vin},${s.timestamp}`).join('\n');
        const blob = new Blob([csv], { type: 'text/csv' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        const date = new Date().toISOString().slice(0, 10);
        a.href     = url;
        a.download = `EOL_scans_${date}.csv`;
        a.click();
        URL.revokeObjectURL(url);
        setStatus('✓ Downloaded', false);
      } catch (err) {
        setStatus('Export failed', true);
      }
      setTimeout(() => setStatus('', false), 2500);
    }

    // ── Load stats on open ──────────────────────────────────────────────────────
    fetch(`${API_URL}?action=getStats`)
      .then(r => r.json())
      .then(d => {
        lastVinEl.textContent = d.lastVin    || '—';
        countEl.textContent   = d.todayCount || 0;
      })
      .catch(() => {});
  </script>

</body>
</html>
